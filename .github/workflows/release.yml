name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Triggered by tag ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Triggered by branch push, check Cargo.toml version
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG_NAME="v$VERSION"
          echo "Detected version: $VERSION"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. No new release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME does not exist. Creating it."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag $TAG_NAME
            git push origin $TAG_NAME
            echo "Created and pushed tag $TAG_NAME"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        # Créée une seule fois ici : les trois builds ne font ensuite qu'y déposer leurs fichiers
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  release:
    needs: check-tag
    if: needs.check-tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          # Ubuntu 22.04 : les binaires restent compatibles avec les glibc plus anciennes
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: ubuntu-22.04-arm
            formats: deb,appimage
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Build installers
        run: cargo packager --release --formats "${{ matrix.formats }}"

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/*.exe release/*.deb release/*.AppImage --clobber
