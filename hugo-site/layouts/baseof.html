<!doctype html>
<html lang="{{ site.Language.LanguageCode }}" class="no-js">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-full focus:bg-brand-500 focus:px-4 focus:py-2 focus:text-white">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  {{ with resources.Get "js/main.js" | js.Build (dict "minify" hugo.IsProduction "params" (dict "repo" site.Params.repo)) | fingerprint }}
    <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{ end }}
</body>
</html>
